<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <meta
      name="description"
      content="VigiaCode — Agenda de Evolução e rastreador de arquitetura para projetos desenvolvidos com agentes de IA."
    />
    <title>VigiaCode · Agenda de Evolução</title>
    <script>
      try {
        var stored = localStorage.getItem('vigiacode-theme');
        document.documentElement.classList.add(stored === 'light' ? 'light' : 'dark');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
